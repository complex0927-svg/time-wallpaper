<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>휴대폰 배경화면</title>

<!-- 가늘고 둥근 숫자 글꼴(Montserrat Light). 필요한 글자(숫자, 점, 쌍점)만 받아 온다.
     받아 오지 못하면 기기의 가는 기본 글꼴로 표시된다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&amp;text=0123456789.%3A&amp;display=swap">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 기준 해상도: 갤럭시 S24 Ultra 세로 화면 (가로 1440 × 세로 3120)
     --w: 이 비율을 유지한 배경화면 너비. 모든 크기는 이 값에 비례한다. */
  :root {
    --screen-w: 1440;
    --screen-h: 3120;
    --w: min(100vw, calc(100vh * var(--screen-w) / var(--screen-h)));
    --scale: 1;   /* 카운트다운 전체 크기 배율 */
  }
  @supports (height: 100dvh) {
    :root { --w: min(100vw, calc(100dvh * var(--screen-w) / var(--screen-h))); }
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Montserrat", "sans-serif-light", "Roboto", "Segoe UI Light", "Segoe UI", sans-serif;
    font-weight: 300;
  }

  .wallpaper {
    --size: calc(var(--w) * 0.102 * var(--scale));   /* 카운트다운 숫자의 글자 크기 */
    --pos-y: 75%;   /* 카운트다운의 세로 위치: 화면 맨 아래 0% ~ 맨 위 100% */
    position: relative;
    width: var(--w);
    height: 100%;
    background: #000;
    color: #fff;
  }

  /* 날짜 + 카운트다운 묶음. 가로는 가운데, 세로는 --pos-y 높이에 묶음의 중심이 온다. */
  .clock {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% - var(--pos-y));
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--size) * 0.55);
  }

  /* 글자를 한 칸씩 같은 너비로 띄워서 놓는다. 숫자가 바뀌어도 자리가 흔들리지 않는다. */
  .line {
    display: flex;
    justify-content: center;
    line-height: 1;
    white-space: nowrap;
  }
  .ch {
    display: block;
    width: 0.74em;
    text-align: center;
  }
  .ch.sep { width: 0.4em; }

  /* 위쪽 작은 줄: 목표 날짜 */
  .date { font-size: calc(var(--size) * 0.6); }

  /* 아래쪽 큰 줄: 남은 일:시:분:초 */
  .countdown {
    --stretch-y: 1.2;   /* 숫자의 세로 길이 배율 (가로 너비는 그대로) */
    font-size: var(--size);
    transform: scaleY(var(--stretch-y));
    transform-origin: center top;   /* 아래쪽으로 늘어나므로 날짜와의 간격은 유지된다 */
  }
  .countdown .sep {
    position: relative;
    top: -0.07em;   /* 쌍점을 숫자 높이의 가운데로 올림 */
  }

  /* 네이버 서버시간 동기화에 실패했을 때만 표시 */
  .notice {
    position: absolute;
    bottom: calc(var(--w) * 0.08);
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    font-weight: 400;
    font-size: calc(var(--w) * 0.028);
    opacity: 0.5;
  }
  .notice[hidden] { display: none; }
</style>
</head>
<body>
  <div class="wallpaper">
    <div class="clock">
      <div class="line date" id="date"></div>
      <div class="line countdown" id="countdown"></div>
    </div>
    <div class="notice" id="notice" hidden>네이버 서버시간 동기화 실패 · 기기 시간 기준</div>
  </div>

<script>
  /* ───────── 설정 ───────── */

  // 카운트다운 목표: 2033년 1월 1일 00:00 (한국 표준시)
  const TARGET_DATE = { year: 2033, month: 1, day: 1 };
  const KST_OFFSET = 9 * 60 * 60 * 1000;
  const TARGET =
    Date.UTC(TARGET_DATE.year, TARGET_DATE.month - 1, TARGET_DATE.day) - KST_OFFSET;

  // 네이버 서버시간 출처: 네이버 금융 실시간 API의 응답에 포함된 서버 시각(result.time, 밀리초).
  // 네이버 메인(www.naver.com)은 브라우저 보안 정책(CORS) 때문에 페이지에서 시각을 읽을 수 없어,
  // 스크립트 태그(JSONP)로 호출할 수 있는 이 주소를 사용한다.
  const NAVER_TIME_URL =
    "https://polling.finance.naver.com/api/realtime?query=SERVICE_ITEM:005930";

  const SYNC_SAMPLES = 3;                  // 한 번 동기화할 때 측정 횟수 (가장 빠른 응답을 채택)
  const SYNC_TIMEOUT = 5000;               // 응답 대기 한도 (ms)
  const RESYNC_INTERVAL = 10 * 60 * 1000;  // 재동기화 주기 (ms)

  /* ───────── 글자 줄 표시 ───────── */

  const pad2 = (n) => String(n).padStart(2, "0");

  // 문자열을 한 글자씩 칸에 나눠 담는다. 바뀐 글자만 다시 쓴다.
  function createLine(container) {
    let cells = [];
    return (text) => {
      if (cells.length !== text.length) {
        container.textContent = "";
        cells = Array.from(text, () => {
          const cell = document.createElement("span");
          container.appendChild(cell);
          return cell;
        });
      }
      cells.forEach((cell, i) => {
        const ch = text[i];
        if (cell.textContent === ch) return;
        cell.textContent = ch;
        cell.className = ch >= "0" && ch <= "9" ? "ch" : "ch sep";
      });
    };
  }

  const showDate = createLine(document.getElementById("date"));
  const showCountdown = createLine(document.getElementById("countdown"));
  const noticeEl = document.getElementById("notice");

  showDate(`${TARGET_DATE.year}.${pad2(TARGET_DATE.month)}.${pad2(TARGET_DATE.day)}`);

  /* ───────── 네이버 서버시간 동기화 ───────── */

  let offset = 0;        // 네이버 서버시간 − 기기 시간 (ms)
  let synced = false;    // 한 번이라도 동기화에 성공했는지
  let syncing = false;
  let callbackSeq = 0;

  // 네이버 서버시간을 한 번 측정해 { offset, rtt }를 돌려준다.
  function measureNaverTime() {
    return new Promise((resolve, reject) => {
      const cbName = "naverTimeCb" + (callbackSeq++);
      const script = document.createElement("script");
      let settled = false;

      const finish = (error, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        window[cbName] = () => {};   // 늦게 도착한 응답은 무시
        script.remove();
        error ? reject(error) : resolve(value);
      };

      const startedAt = performance.now();
      const timeout = setTimeout(() => finish(new Error("timeout")), SYNC_TIMEOUT);

      window[cbName] = (data) => {
        const rtt = performance.now() - startedAt;
        const serverMs = data && data.result && data.result.time;
        if (typeof serverMs !== "number") return finish(new Error("no time in response"));
        // 응답이 오는 데 걸린 시간의 절반만큼 서버 시각이 지났다고 보고 보정한다.
        finish(null, { offset: serverMs + rtt / 2 - Date.now(), rtt });
      };

      script.onerror = () => finish(new Error("request failed"));
      script.src = `${NAVER_TIME_URL}&_callback=${cbName}&_=${Date.now()}`;
      document.head.appendChild(script);
    });
  }

  async function sync() {
    if (syncing) return;
    syncing = true;
    let best = null;
    for (let i = 0; i < SYNC_SAMPLES; i++) {
      try {
        const sample = await measureNaverTime();
        if (!best || sample.rtt < best.rtt) best = sample;
      } catch (e) { /* 다음 측정으로 넘어감 */ }
    }
    syncing = false;

    if (best) {
      offset = best.offset;
      synced = true;
    }
    // 동기화에 한 번도 성공하지 못했으면 기기 시간으로 표시하고 그 사실을 알린다.
    noticeEl.hidden = synced;
    document.documentElement.dataset.timeSource = synced ? "naver" : "device";
    tick();
  }

  /* ───────── 카운트다운 표시 ───────── */

  let tickTimer = null;

  function tick() {
    clearTimeout(tickTimer);
    const remain = TARGET - (Date.now() + offset);
    const total = Math.max(0, Math.floor(remain / 1000));   // 남은 시간 (초)

    const days = Math.floor(total / 86400);
    const hours = Math.floor((total % 86400) / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;
    showCountdown(`${pad2(days)}:${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)}`);

    if (remain <= 0) return;                             // 목표 시각 도달: 0에서 멈춤
    tickTimer = setTimeout(tick, (remain % 1000) + 10);  // 다음 초가 바뀌는 순간에 맞춰 갱신
  }

  tick();   // 동기화 전에도 기기 시간으로 먼저 표시
  sync();
  setInterval(sync, RESYNC_INTERVAL);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { tick(); sync(); checkForUpdate(); }
  });

  /* ───────── 자동 업데이트 ───────── */

  // 배경화면 앱은 한 번 불러온 페이지를 계속 띄워 두므로, 파일을 수정해도 화면이 저절로 바뀌지 않는다.
  // 서버의 파일이 바뀌었는지 주기적으로 확인하고, 바뀌었으면 새 주소(?v=버전)로 다시 불러온다.
  // 주소가 달라지면 저장해 둔 예전 사본(캐시)을 쓰지 않고 새 파일을 받아 온다.
  const UPDATE_CHECK_INTERVAL = 60 * 1000;   // 확인 주기 (ms)
  const RELOAD_COOLDOWN = 30 * 1000;         // 연속 새로고침 방지 간격 (ms)

  let loadedVersion = new URLSearchParams(location.search).get("v");   // 지금 떠 있는 페이지의 버전
  let checkingUpdate = false;

  function reloadAs(version) {
    try {
      const last = Number(sessionStorage.getItem("lastReload")) || 0;
      if (Date.now() - last < RELOAD_COOLDOWN) return;
      sessionStorage.setItem("lastReload", String(Date.now()));
    } catch (e) { /* 저장소를 못 쓰는 환경: 그대로 진행 */ }
    location.replace(`${location.pathname}?v=${version}`);
  }

  async function checkForUpdate() {
    if (!location.protocol.startsWith("http")) return;   // PC에서 파일로 직접 열었을 때는 건너뜀
    if (checkingUpdate || document.hidden) return;
    checkingUpdate = true;
    try {
      const res = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
      if (!res.ok) return;
      // 서버가 알려 주는 파일 식별값(ETag). 파일 내용이 바뀌면 이 값도 바뀐다.
      const latest = (res.headers.get("ETag") || res.headers.get("Last-Modified") || "")
        .replace(/^W\//, "").replace(/[^\w-]/g, "");
      if (!latest) return;

      if (loadedVersion === null) {
        // 버전 표시 없이 열린 경우: 지금 떠 있는 문서의 수정 시각이 서버와 같으면 최신으로 본다.
        const serverTime = Date.parse(res.headers.get("Last-Modified"));
        const loadedTime = Date.parse(document.lastModified);
        if (serverTime && Math.abs(serverTime - loadedTime) < 2000) loadedVersion = latest;
      }
      document.documentElement.dataset.version = loadedVersion || "stale";
      if (latest !== loadedVersion) reloadAs(latest);
    } catch (e) {
      /* 네트워크 오류: 다음 확인 때 다시 시도 */
    } finally {
      checkingUpdate = false;
    }
  }

  checkForUpdate();
  setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL);
</script>
</body>
</html>
